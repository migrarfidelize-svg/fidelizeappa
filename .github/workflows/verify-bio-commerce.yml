name: Verify Bio Commerce

on:
  push:
    branches:
      - upgrade/linktree-premium-v2
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun x tsc --noEmit
      - name: Targeted QR naming test
        run: bun test src/lib/qr-design-name.test.ts
