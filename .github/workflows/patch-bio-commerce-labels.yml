name: Patch Bio Commerce labels

on:
  push:
    branches:
      - upgrade/linktree-premium-v2
    paths:
      - .github/workflows/patch-bio-commerce-labels.yml

permissions:
  contents: write

jobs:
  patch-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/linktree-premium-v2
          fetch-depth: 0

      - name: Replace legacy user-facing name
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "Árvore de Links": "Bio Commerce",
              "Árvore de links": "Bio Commerce",
              "árvore de links": "Bio Commerce",
          }

          changed = []
          for path in Path("src").rglob("*"):
              if path.suffix not in {".ts", ".tsx"} or not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Arquivos ajustados:")
          for item in changed:
              print(" -", item)
          PY

      - name: Commit exact label changes
        run: |
          if git diff --quiet; then
            echo "Nenhum rótulo legado restante."
            exit 0
          fi
          git config user.name "Fidelize CI"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "feat(bio-commerce): remove nome legado da interface"
          git push origin HEAD:upgrade/linktree-premium-v2
