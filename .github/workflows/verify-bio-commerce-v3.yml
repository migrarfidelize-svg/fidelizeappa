name: Verify Bio Commerce V3

on:
  push:
    branches:
      - upgrade/linktree-premium-v2
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun x tsc --noEmit
      - name: VPS build
        run: bun run build:vps
